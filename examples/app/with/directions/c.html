<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=390,initial-scale=1">
<title>Crate C Pile</title>
<link href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Chivo+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--con:#D8D6CE;--coral:#FF3D5A;--ink:#141414}
*{box-sizing:border-box;margin:0}
html,body{width:390px;height:844px;overflow:hidden;font-family:'Chivo Mono',monospace;background:var(--con);-webkit-user-select:none;user-select:none}
.phone{position:relative;width:390px;height:844px;overflow:hidden;touch-action:none;background:var(--con)}
.phone:before{content:"";position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .44 0 0 0 0 .42 0 0 0 .9 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.sb{position:absolute;top:14px;left:28px;right:28px;display:flex;justify-content:space-between;font:600 14px 'Chivo Mono';z-index:900}
h1{position:absolute;left:18px;top:50px;font:400 92px/0.86 'Bowlby One';letter-spacing:-.03em;color:var(--ink);z-index:1;pointer-events:none}
h1 small{display:block;font:600 12px 'Chivo Mono';letter-spacing:.08em;margin-bottom:10px}
.rec{position:absolute;left:0;top:0;width:176px;height:176px;will-change:transform;cursor:grab;touch-action:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.35))}
.rec img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;border-radius:2px}
.tag{position:absolute;right:-12px;top:-12px;width:54px;height:54px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font:600 14px 'Chivo Mono';transform:rotate(12deg);box-shadow:0 2px 4px #0004;pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:-42px;font:600 11px 'Chivo Mono';color:var(--ink);text-align:center;opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
.rec.sel .cap{opacity:1}
.stub{position:absolute;left:16px;right:16px;bottom:26px;height:72px;background:var(--ink);color:#fff;z-index:800;display:flex;align-items:center;padding:0 18px;gap:14px;
 -webkit-mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 9px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;transform:rotate(-1.2deg);pointer-events:none}
.stub .n{font:400 44px 'Bowlby One';color:var(--coral);line-height:1}
.stub .l{flex:1;font-size:12px;line-height:1.35;border-left:2px dashed #fff6;padding-left:14px}.stub .l b{display:block;font-size:14px}
.stub i{width:10px;height:10px;border-radius:50%;background:var(--coral);animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.hi{position:absolute;bottom:8px;left:125px;width:140px;height:5px;border-radius:3px;background:var(--ink);z-index:950}
.hint{position:absolute;right:20px;top:196px;font:600 11px 'Chivo Mono';text-align:right;line-height:1.4;z-index:2}
</style></head><body><div class="phone" id="ph">
<div class="sb"><span>9:41</span><span>5G ▮▮▮</span></div>
<h1><small>CRATE — JUST IN</small>NEW<br>IN.</h1>
<div class="hint">8 records<br>tossed on the bench<br>push them around</div>
<div class="stub"><span class="n">4</span><span class="l"><b>Listening booth</b>you're 4th, about 11 min</span><i></i></div>
<div class="hi"></div></div>
<script>
const R=[['s3','Luma Brandt — Stairwell Sun','€27'],['s1','Ösel — Overprint','€24'],['s0','Nadia Keller — Deep End','€29'],['s2','Tobi Amadi Quartet — Peach Season','€31'],['s4','Kesh & Moon — Last Tram','€26'],['s5','Hollis Vane — Inflatable Hour','€28'],['s6','Sol Ribeiro — Snake Year','€30'],['s7','The Quiet Committee — Field Notes','€34']];
// resting spots (centre x,y) and angles, like a hand-thrown pile
const SP=[[100,340,-8],[285,330,7],[195,430,3],[90,500,-11],[300,520,9],[200,585,-5],[100,655,8],[290,660,-6]];
const W=390,H=844,ph=document.getElementById('ph');let zt=10,sel=null;
const B=R.map(([im,cap,pr],i)=>{const e=document.createElement('div');e.className='rec';e.innerHTML=`<img src="img/${im}.webp" alt="${cap}"><span class="tag">${pr}</span><span class="cap">${cap}</span>`;ph.appendChild(e);
 const s=SP[i],sz=164-(i%3)*8;e.style.width=e.style.height=sz+'px';
 const b={e,i,sz,x:s[0]+(i%2?60:-60),y:-300-i*190,vx:0,vy:0,a:(s[2]*3)+(i%2?40:-40),va:0,tx:s[0],ty:s[1],ta:s[2],drop:true,delay:i*140,z:i,held:false};e.style.zIndex=i;return b});
const t0=performance.now();
function step(dt){const tt=performance.now()-t0;
 B.forEach(b=>{
  if(b.held)return;
  if(b.drop){ if(tt<b.delay){return} // fall under gravity, bounce on the bench (target y)
    b.vy+=2600*dt;b.y+=b.vy*dt;b.x+=(b.tx-b.x)*Math.min(1,dt*6);b.a+=(b.ta-b.a)*Math.min(1,dt*7);
    if(b.y>=b.ty){b.y=b.ty;b.vy*=-.38;if(Math.abs(b.vy)<120){b.vy=0;b.drop=false}}}
  else{ b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.va*dt;const f=Math.pow(.02,dt);b.vx*=f;b.vy*=f;b.va*=f;
    const m=b.sz/2-20;if(b.x<m){b.x=m;b.vx*=-.5}if(b.x>W-m){b.x=W-m;b.vx*=-.5}if(b.y<m+40){b.y=m+40;b.vy*=-.5}if(b.y>H-m-60){b.y=H-m-60;b.vy*=-.5}}
  });}
function draw(){B.forEach(b=>{const sc=b.held?1.07:(b===sel?1.5:1);b.e.style.transform=`translate3d(${b.x-b.sz/2}px,${b.y-b.sz/2}px,0) rotate(${b.a}deg) scale(${sc})`})}
let last=performance.now();(function loop(n){const dt=Math.min(.033,(n-last)/1000);last=n;step(dt);draw();requestAnimationFrame(loop)})(last);
let drag=null;
ph.addEventListener('pointerdown',e=>{const el=e.target.closest('.rec');if(!el)return;const b=B.find(x=>x.e===el);ph.setPointerCapture(e.pointerId);
 drag={b,ox:e.clientX-b.x,oy:e.clientY-b.y,mx:e.clientX,my:e.clientY,t:performance.now(),moved:0,lx:e.clientX,ly:e.clientY,lt:performance.now(),vx:0,vy:0};b.held=true;b.drop=false;b.vx=b.vy=0;b.e.style.zIndex=++zt});
ph.addEventListener('pointermove',e=>{if(!drag)return;const b=drag.b,now=performance.now(),dt=Math.max(1,now-drag.lt)/1000;
 drag.vx=.6*drag.vx+.4*(e.clientX-drag.lx)/dt;drag.vy=.6*drag.vy+.4*(e.clientY-drag.ly)/dt;drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=now;
 drag.moved+=Math.hypot(e.movementX||0,e.movementY||0);b.x=e.clientX-drag.ox;b.y=e.clientY-drag.oy;b.a+=(drag.vx/900-(b.a-b.ta)*.0)*.12});
ph.addEventListener('pointerup',e=>{if(!drag)return;const b=drag.b;b.held=false;
 if(drag.moved<6){ // tap: lift to the front and show the caption
   if(sel){sel.e.classList.remove('sel')}sel=(sel===b)?null:b;if(sel){b.e.classList.add('sel');b.vx=b.vy=0;}}
 else{b.vx=drag.vx;b.vy=drag.vy;b.va=drag.vx/14;if(sel){sel.e.classList.remove('sel');sel=null}}
 drag=null});
</script></body></html>
