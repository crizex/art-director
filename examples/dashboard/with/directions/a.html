<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vault A: The Room Fills</title>
<meta name="viewport" content="width=1440">
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@100..150,300..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0A0B0D;--work:#DCEBFA;--show:#FF9F3A}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--ink);color:var(--work);font-family:'Anybody',sans-serif}
#room{position:absolute;inset:0;width:1440px;height:900px}
.shade{position:absolute;inset:0;pointer-events:none;background:
 linear-gradient(to bottom,rgba(10,11,13,.78) 0,rgba(10,11,13,.0) 300px),
 linear-gradient(to top,rgba(10,11,13,.94) 0,rgba(10,11,13,.86) 150px,rgba(10,11,13,0) 330px)}
.mono{font:500 13px/1 'IBM Plex Mono';letter-spacing:.12em;text-transform:uppercase}
#top{position:absolute;left:40px;top:30px}
#top .mono{color:var(--work);opacity:.9}
#big{font:900 184px/.82 'Anybody';font-stretch:132%;letter-spacing:-.03em;margin:18px 0 0 -6px;color:var(--work);text-shadow:0 4px 40px rgba(0,0,0,.55);font-variant-numeric:tabular-nums}
#big small{display:block;font:500 15px 'IBM Plex Mono';letter-spacing:.12em;margin:16px 0 0 6px;text-transform:uppercase;color:var(--show)}
#clock{position:absolute;right:40px;top:26px;text-align:right}
#clock b{font:800 76px/1 'Anybody';font-stretch:130%;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#clock i{font:500 26px 'IBM Plex Mono';font-style:normal;color:var(--show)}
.tag{position:absolute;transform:translate(-50%,-100%);text-align:left;padding:10px 16px 12px;background:rgba(8,8,10,.62);backdrop-filter:blur(6px);border-left:3px solid var(--show)}
.tag .mono{color:var(--work);opacity:.85;margin-bottom:6px;font-size:12px}
.tag b{font:900 66px/.9 'Anybody';font-stretch:130%;font-variant-numeric:tabular-nums;display:block}
.tag b sup{font-size:26px;color:var(--show);vertical-align:top;margin-left:3px;font-weight:700}
.tag span{font:500 13px 'IBM Plex Mono';color:var(--show);letter-spacing:.06em}
.lead{position:absolute;width:1px;background:linear-gradient(var(--show),transparent);opacity:.7}
#strip{position:absolute;left:40px;right:40px;bottom:94px;display:flex;align-items:flex-end;gap:0}
.door{flex:0 0 172px;position:relative;padding-left:14px;border-left:1px solid rgba(220,235,250,.3)}
.door:first-child{border-left:0;padding-left:0}
.door .mono{color:var(--work);opacity:.75;font-size:12px}
.door b{display:block;font:800 46px/1 'Anybody';font-stretch:125%;font-variant-numeric:tabular-nums;margin-top:6px}
.door em{font:500 13px 'IBM Plex Mono';font-style:normal;color:var(--show)}
.door.hit b{animation:hit .5s ease-out}
@keyframes hit{0%{color:var(--show);text-shadow:0 0 30px var(--show)}100%{color:var(--work);text-shadow:none}}
#sales{margin-left:auto;text-align:right}
#sales .mono{color:var(--work);opacity:.75;font-size:12px}
#sales b{display:block;font:900 76px/.95 'Anybody';font-stretch:135%;font-variant-numeric:tabular-nums;color:var(--show);margin-top:4px}
#sales em{font:500 13px 'IBM Plex Mono';font-style:normal}
#tl{position:absolute;left:40px;right:40px;bottom:28px;height:46px}
#tl .rail{position:absolute;left:0;right:0;top:0;height:2px;background:rgba(220,235,250,.25)}
.act{position:absolute;top:-6px;height:14px;background:rgba(220,235,250,.28)}
.act.now{background:var(--show)}
.act.done{background:rgba(220,235,250,.14)}
.lab{position:absolute;top:16px;white-space:nowrap}
.lab .mono{font-size:12px;color:var(--work);opacity:.8}
.lab.now .mono{color:var(--show);opacity:1;font-weight:600}
#play{position:absolute;top:-16px;width:2px;height:36px;background:var(--show);box-shadow:0 0 14px var(--show)}
#play:before{content:"";position:absolute;top:-7px;left:-5px;border:6px solid transparent;border-top:8px solid var(--show);border-bottom:0}
.live{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--show);margin-right:9px;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
</style></head><body>
<canvas id="room" width="1440" height="900"></canvas>
<div class="shade"></div>
<div id="top">
  <div class="mono"><span class="live"></span>Vault &nbsp;/&nbsp; Sat 30 Sep &nbsp;/&nbsp; Doors 19:00 &nbsp;/&nbsp; On stage: Oda Brandt</div>
  <div id="big"><span id="inside">757</span><small>inside now &nbsp;/&nbsp; of 1,500</small></div>
</div>
<div id="clock"><b id="hm">20:31</b><i id="ss">:00</i></div>

<div class="lead" style="left:1330px;top:492px;height:40px"></div>
<div class="tag" id="t-floor" style="left:720px;top:612px"><div class="mono">Floor</div><b>50<sup>%</sup></b><span>450 / 900</span></div>
<div class="tag" id="t-balc" style="left:236px;top:440px"><div class="mono">Balcony</div><b>62<sup>%</sup></b><span>217 / 350</span></div>
<div class="tag" id="t-bar" style="left:1290px;top:546px"><div class="mono">Bar + foyer</div><b>36<sup>%</sup></b><span>90 / 250</span></div>

<div id="strip">
  <div class="door" id="d0"><div class="mono">Door A</div><b>255</b><em>+19 / min</em></div>
  <div class="door" id="d1"><div class="mono">Door B</div><b>240</b><em>+17 / min</em></div>
  <div class="door" id="d2"><div class="mono">Door C</div><b>196</b><em>+12 / min</em></div>
  <div class="door" id="d3"><div class="mono">Door D · VIP</div><b>72</b><em>+4 / min</em></div>
  <div id="sales"><div class="mono">Bar sales tonight</div><b id="eur">€14,310</b><em id="pm">€212 / min</em></div>
</div>

<div id="tl"><div class="rail"></div><div id="acts"></div><div id="play"></div></div>

<script>
const W=1440,H=900,IW=2000,IH=1116,S=Math.max(W/IW,H/IH),OX=(W-IW*S)/2;
const cv=document.getElementById('room'),cx=cv.getContext('2d');
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const P=(x,y)=>[x*S+OX,y*S];
// zones in source-image coordinates; dir = reveal direction (unit vector), reveal starts where people enter
const zones=[
 {id:'floor',cap:900,v:.50,tgt:.60,poly:[[150,575],[1850,575],[1930,850],[60,850]],origin:[1000,850],span:290},
 {id:'balc',cap:350,v:.62,tgt:.72,poly:[[0,190],[800,420],[800,515],[0,505]],poly2:[[1200,420],[2000,190],[2000,505],[1200,515]],poly3:[[780,430],[1220,430],[1220,520],[780,520]],origin:[1000,0],span:1000,horiz:true},
 {id:'bar',cap:250,v:.36,tgt:.50,poly:[[1320,555],[1960,555],[1960,760],[1330,760]],origin:[1330,0],span:640,horiz:true}
];
const fmt=n=>Math.round(n).toLocaleString('en-US');
let E,F;
function path(c,poly){c.beginPath();poly.forEach((p,i)=>{const[x,y]=P(...p);i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath()}
const off=document.createElement('canvas');off.width=W;off.height=H;const oc=off.getContext('2d');
function frame(t){
  const tot=zones.reduce((a,z)=>a+z.v*z.cap,0)/1500;
  // breathing camera
  const k=1+Math.sin(t/3200)*.004;
  cx.save();cx.clearRect(0,0,W,H);cx.translate(W/2,H/2);cx.scale(k,k);cx.translate(-W/2,-H/2);
  cx.drawImage(E,OX,0,IW*S,IH*S);
  // house atmosphere warms with the total
  cx.globalAlpha=.16*tot;cx.drawImage(F,OX,0,IW*S,IH*S);cx.globalAlpha=1;
  for(const z of zones){
    oc.clearRect(0,0,W,H);oc.globalCompositeOperation='source-over';
    oc.drawImage(F,OX,0,IW*S,IH*S);
    oc.globalCompositeOperation='destination-in';
    // mask polygons
    const m=document.createElement('canvas');m.width=W;m.height=H;const mc=m.getContext('2d');
    mc.fillStyle='#000';
    for(const pk of ['poly','poly2','poly3']) if(z[pk]){path(mc,z[pk]);mc.fill()}
    // soft reveal edge
    const wob=Math.sin(t/700+z.cap)*.012;
    mc.globalCompositeOperation='destination-in';
    const f=Math.min(1,Math.max(0,z.v+wob));
    let g;
    if(z.horiz){const a=P(z.origin[0]-z.span*1,0)[0],b=P(z.origin[0]+z.span,0)[0];
      if(z.id==='balc'){ // centre out
        const cxp=P(1000,0)[0],r=z.span*S*f*1.0; g=mc.createLinearGradient(cxp-z.span*S,0,cxp+z.span*S,0);
        const u=f,e=.06;const s0=Math.max(0,.5-u/2),s1=Math.min(1,.5+u/2);
        g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(Math.max(0,s0-e),'rgba(0,0,0,0)');g.addColorStop(s0,'#000');g.addColorStop(s1,'#000');g.addColorStop(Math.min(1,s1+e),'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0)');
      }else{const x0=P(z.origin[0],0)[0],x1=x0+z.span*S;g=mc.createLinearGradient(x0,0,x1,0);const e=.08;
        g.addColorStop(0,'#000');g.addColorStop(Math.max(0,f-e),'#000');g.addColorStop(Math.min(1,f+e),'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0)');}
    }else{const y0=P(0,z.origin[1])[1],y1=y0-z.span*S;g=mc.createLinearGradient(0,y0,0,y1);const e=.1;
      g.addColorStop(0,'#000');g.addColorStop(Math.max(0,f-e),'#000');g.addColorStop(Math.min(1,f+e),'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0)');}
    mc.fillStyle=g;mc.fillRect(0,0,W,H);
    oc.drawImage(m,0,0);
    cx.drawImage(off,0,0);
  }
  // amber flicker of show light along the top
  const fl=.06+.04*Math.sin(t/230)+.03*Math.sin(t/97);
  const gr=cx.createRadialGradient(W*.5,-60,40,W*.5,-60,760);gr.addColorStop(0,`rgba(255,159,58,${fl*tot*3})`);gr.addColorStop(1,'rgba(255,159,58,0)');
  cx.fillStyle=gr;cx.fillRect(0,0,W,H);
  cx.restore();
  requestAnimationFrame(frame);
}
// simulation (demo runs ~8x real time so a 6 s clip shows the room filling)
const doors=[{n:255,r:19},{n:240,r:17},{n:196,r:12},{n:72,r:4}];let eur=14310,inside=757;
const SP=16;
setInterval(()=>{
  doors.forEach((d,i)=>{ if(Math.random()<d.r*SP/60*.25){d.n++;inside++;const el=document.getElementById('d'+i);el.querySelector('b').textContent=fmt(d.n);el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit')}});
  eur+=Math.random()*212*SP/60*.25*1.2;
  document.getElementById('eur').textContent='€'+fmt(eur);
  const tn=doors.reduce((a,d)=>a+d.n,0);
  // distribute arrivals: floor/bar/balc targets
  zones[0].v=Math.min(zones[0].tgt,zones[0].v+.002);zones[1].v=Math.min(zones[1].tgt,zones[1].v+.0035);zones[2].v=Math.min(zones[2].tgt,zones[2].v+.0035);
  const ins=zones.reduce((a,z)=>a+z.v*z.cap,0);
  document.getElementById('inside').textContent=fmt(ins);
  const set=(id,z)=>{const e=document.getElementById(id);e.querySelector('b').innerHTML=Math.round(z.v*100)+'<sup>%</sup>';e.querySelector('span').textContent=fmt(z.v*z.cap)+' / '+z.cap};
  set('t-floor',zones[0]);set('t-balc',zones[1]);set('t-bar',zones[2]);
},250);
// clock + timeline
const T0=20*60+31;let st=performance.now();
function tick(){const s=(performance.now()-st)/1000;const mm=T0+Math.floor(s/60);document.getElementById('hm').textContent=String(Math.floor(mm/60)).padStart(2,'0')+':'+String(mm%60).padStart(2,'0');document.getElementById('ss').textContent=':'+String(Math.floor(s%60)).padStart(2,'0');
  const tlStart=19*60,tlEnd=25*60,now=T0+s/60;document.getElementById('play').style.left=((now-tlStart)/(tlEnd-tlStart)*100)+'%';}
setInterval(tick,200);tick();
const acts=[['Doors',19*60,20*60,'done'],['Oda Brandt',20*60,20*60+55,'now'],['Mira Lund',21*60+15,22*60+45,''],['Kolja Venn',23*60+15,24*60+30,'']];
const box=document.getElementById('acts');
acts.forEach(([n,a,b,c])=>{const l=(a-19*60)/360*100,w=(b-a)/360*100;const d=document.createElement('div');d.className='act '+c;d.style.left=l+'%';d.style.width=w+'%';box.appendChild(d);
 const t=document.createElement('div');t.className='lab '+c;t.style.left=l+'%';const hh=x=>String(Math.floor(x/60)%24).padStart(2,'0')+':'+String(x%60).padStart(2,'0');t.innerHTML=`<div class="mono">${hh(a)} ${n}${c==='now'?' &nbsp;NOW':''}</div>`;box.appendChild(t)});
const cu=document.createElement('div');cu.className='lab';cu.style.right='0';cu.innerHTML='<div class="mono">01:00 Curfew</div>';box.appendChild(cu);
Promise.all([load('img/room-empty.webp'),load('img/room-full.webp'),document.fonts.ready]).then(([e,f])=>{E=e;F=f;requestAnimationFrame(frame);document.title+=''; window.READY=1});
</script></body></html>
