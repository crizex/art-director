<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Vault B: Live Gallery</title>
<meta name="viewport" content="width=1440">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Barlow:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#06141C;--white:#F5F8FA;--red:#FF2B2B;--mute:#9DB4C0}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--ink);color:var(--white);font-family:'Barlow Condensed',sans-serif}
.num{font-variant-numeric:tabular-nums}
#pgm{position:absolute;left:16px;top:16px;width:960px;height:540px;overflow:hidden;outline:4px solid var(--red);outline-offset:0;background:#000}
#pgm img{position:absolute;left:-60px;top:-34px;width:1080px;height:auto;transform-origin:62% 40%;animation:kb 40s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.0) translate(0,0)}to{transform:scale(1.16) translate(-18px,-6px)}}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
.plate{background:var(--white);color:var(--ink);transform:skewX(-12deg);display:flex;align-items:stretch}
.plate>*{transform:skewX(12deg)}
#bug{position:absolute;left:20px;top:20px;display:flex;gap:0;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
#bug .brand{background:var(--red);color:#fff;transform:skewX(-12deg);padding:0 22px 0 26px;display:flex;align-items:center;font:700 34px/1 'Barlow Condensed';letter-spacing:.06em}
#bug .brand span{transform:skewX(12deg);display:flex;align-items:center;gap:10px}
#bug .brand i{width:12px;height:12px;border-radius:50%;background:#fff;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
#bug .lab{padding:6px 14px 6px 20px;font:600 15px 'Barlow';letter-spacing:.14em;text-transform:uppercase;display:flex;flex-direction:column;justify-content:center;color:#3c5563}
#bug .sc{padding:0 12px 0 0;font:700 62px/1 'Barlow Condensed';display:flex;align-items:center}
#bug .cap{padding:0 26px 0 0;font:600 26px 'Barlow Condensed';display:flex;align-items:center;color:#3c5563}
#clk{position:absolute;right:20px;top:20px;padding:0 22px;height:62px;font:700 46px/62px 'Barlow Condensed';background:var(--ink);color:#fff;transform:skewX(-12deg);box-shadow:0 6px 18px rgba(0,0,0,.45)}
#clk span{display:inline-block;transform:skewX(12deg)}
#clk s{text-decoration:none;color:var(--mute);font-size:26px}
#lt{position:absolute;left:20px;bottom:22px;height:150px;width:700px}
.g{position:absolute;left:0;bottom:0;clip-path:inset(0 100% 0 0);transition:clip-path .55s cubic-bezier(.7,0,.2,1)}
.g.on{clip-path:inset(0 0 0 0)}
.g.off{clip-path:inset(0 0 0 100%)}
.g .top{transform-origin:left bottom;background:var(--red);color:#fff;display:inline-block;transform:skewX(-12deg);padding:4px 22px 4px 22px;font:700 24px 'Barlow Condensed';letter-spacing:.14em;text-transform:uppercase}
.g .top span{display:inline-block;transform:skewX(12deg)}
.g .body{background:var(--white);color:var(--ink);transform:skewX(-12deg);padding:6px 34px 8px 30px;display:flex;align-items:baseline;gap:26px;transform-origin:left bottom;white-space:nowrap}
.g .body>*{transform:skewX(12deg);display:block}
.g h2{font:700 84px/1 'Barlow Condensed';text-transform:uppercase;letter-spacing:.01em}
.g .sm{font:600 28px 'Barlow Condensed';color:#3c5563;text-transform:uppercase;letter-spacing:.06em}
.g .cell{display:inline-block;margin-right:0;white-space:nowrap}
.g .cell b{font:700 64px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.g .cell em{font:600 20px 'Barlow Condensed';font-style:normal;letter-spacing:.14em;color:#3c5563;margin-right:8px}
.g .cell.hit b{animation:hit .6s}
@keyframes hit{0%{color:var(--red)}100%{color:var(--ink)}}
.cam{position:absolute;left:992px;width:432px;height:243px;overflow:hidden;background:#000}
.cam img{position:absolute;transform-origin:50% 50%;animation:pan 14s ease-in-out infinite alternate}
@keyframes pan{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-10px,-5px)}}
.cam:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.14) 2px 3px);pointer-events:none}
.cam .nm{position:absolute;left:0;top:12px;z-index:2;background:var(--ink);color:#fff;padding:2px 14px 2px 12px;font:700 22px/1.25 'Barlow Condensed';letter-spacing:.12em}
.cam .nm b{color:var(--mute);font-weight:600;margin-right:8px}
.cam .pc{position:absolute;right:0;bottom:0;z-index:2;background:var(--white);color:var(--ink);padding:0 16px 0 18px;font:700 76px/1 'Barlow Condensed';font-variant-numeric:tabular-nums}
.cam .pc small{font:600 24px 'Barlow Condensed';color:#3c5563;margin-left:10px;letter-spacing:.06em}
.cam .bar{position:absolute;left:0;bottom:0;height:8px;z-index:3;background:var(--white)}
.cam.hot{outline:4px solid var(--red);outline-offset:-4px}
.cam.hot .nm{background:var(--red)}
#rd{position:absolute;left:16px;top:572px;width:960px;height:200px}
.row{display:flex;align-items:center;height:40px;padding:0 18px;font:600 30px 'Barlow Condensed';letter-spacing:.04em;text-transform:uppercase;border-bottom:1px solid rgba(245,248,250,.14);position:relative}
.row .t{width:110px;font-variant-numeric:tabular-nums;color:var(--mute)}
.row .n{flex:1}
.row .s{color:var(--mute);font-size:24px;letter-spacing:.12em}
.row.done{opacity:.4}.row.done .n{text-decoration:line-through}
.row.now{background:var(--white);color:var(--ink);font-size:38px;height:44px;border:0}
.row.now .t{color:var(--ink);font-weight:700}
.row.now .s{color:var(--red);font-weight:700;font-size:30px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.row.now:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--red)}
.row.now i{position:absolute;left:0;bottom:0;height:5px;background:var(--red)}
#tk{position:absolute;left:0;right:0;top:790px;height:94px;border-top:4px solid var(--red)}
.tk{position:absolute;left:0;right:0;height:45px;overflow:hidden;white-space:nowrap;font:600 28px/45px 'Barlow Condensed';letter-spacing:.05em;text-transform:uppercase}
.tk .h{position:absolute;left:0;top:0;bottom:0;z-index:2;padding:0 20px 0 16px;background:var(--red);color:#fff;font-weight:700;letter-spacing:.14em;width:150px}
.tk .r{position:absolute;left:150px;top:0;display:inline-block;will-change:transform}
.tk .r span{display:inline-block;margin-right:34px}.tk .r span b{color:var(--mute);font-weight:600;margin-right:8px}
.tk .r span.big b{color:var(--white)}
#t1{top:0}#t2{top:45px;background:rgba(245,248,250,.08)}
#t2 .h{background:var(--white);color:var(--ink)}
</style></head><body>
<div id="pgm"><img src="img/stage-mira.webp" alt=""><div id="flash"></div>
 <div id="bug"><div class="brand"><span><i></i>VAULT LIVE</span></div>
  <div class="plate"><div class="lab">Inside</div><div class="sc" id="ins">1,414</div><div class="cap">/ 1,500</div></div></div>
 <div id="clk"><span id="hm">21:47</span> <span><s id="ss">:04</s></span></div>
 <div id="lt">
  <div class="g" id="g0"><div class="top"><span>On stage now</span></div><div class="body"><h2>Mira Lund</h2><div class="sm" id="left">58:12 left</div></div></div>
  <div class="g" id="g1"><div class="top"><span>Ticket scans by door</span></div><div class="body" id="doors"></div></div>
  <div class="g" id="g2"><div class="top"><span>Bar sales tonight</span></div><div class="body"><h2 class="num" id="eur">€38,775</h2><div class="sm" id="pm">€466 per min</div></div></div>
 </div>
</div>
<div class="cam" id="c1" style="top:16px"></div>
<div class="cam" id="c2" style="top:271px"></div>
<div class="cam" id="c3" style="top:526px"></div>
<div id="rd"></div>
<div id="tk"><div class="tk" id="t1"><div class="h">SCANS</div><div class="r" id="r1"></div></div><div class="tk" id="t2"><div class="h">BARS</div><div class="r" id="r2"></div></div></div>
<script>
const fmt=n=>Math.round(n).toLocaleString('en-US');
// seeded-ish fake data
let s=12345;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const doors=[{l:'A',n:4112,r:18},{l:'B',n:3941,r:17},{l:'C',n:2866,r:13},{l:'D',n:1204,r:6}];
const dh=document.getElementById('doors');dh.innerHTML=doors.map((d,i)=>`<span class="cell" id="dc${i}"><em>DOOR ${d.l}</em><b>${fmt(d.n)}</b></span>`).join('');
// cams cropped from the generated room photo
const cams=[['c1','2','FLOOR',{x:520,y:470,w:960},83,748,900],['c2','3','BALCONY',{x:0,y:110,w:960},92,323,350],['c3','4','BAR E',{x:1040,y:380,w:960},88,88,100]];
cams.forEach(([id,n,name,r,p,a,b])=>{const e=document.getElementById(id);const k=432/r.w;
 e.innerHTML=`<img src="img/room-full.webp" style="width:${2000*k}px;left:${-r.x*k}px;top:${-r.y*k}px"><div class="nm"><b>CAM ${n}</b>${name}</div><div class="pc num"><span>${p}</span>%<small>${a}/${b}</small></div><div class="bar" style="width:${p}%"></div>`;
 if(p>=90)e.classList.add('hot');});
// rundown
const rows=[['19:00','Doors','done','open'],['20:00','Oda Brandt','done','played'],['21:15','Mira Lund','now',''],['23:15','Kolja Venn','','in 1:27'],['01:00','Curfew','','']];
document.getElementById('rd').innerHTML=rows.map(([t,n,c,st])=>`<div class="row ${c}"><div class="t">${t}</div><div class="n">${n}</div><div class="s" ${c==='now'?'id="rs"':''}>${st}</div>${c==='now'?'<i id="pb" style="width:61%"></i>':''}</div>`).join('');
// tickers
const gates=['A','B','C','D'],types=['GA','GA','GA','VIP','GUEST','GA'];let sc=12400;
const scan=()=>{sc+=1;const g=gates[Math.floor(rnd()*4)];const hh='21:'+String(30+Math.floor(rnd()*17)).padStart(2,'0')+':'+String(Math.floor(rnd()*60)).padStart(2,'0');return `<span><b>${hh}</b>Door ${g} · ticket ${String(4000+Math.floor(rnd()*9000))} · ${types[Math.floor(rnd()*6)]} ✓</span>`};
const items=['2× Helles','1× Gin tonic','3× Water','2× Pils','1× Negroni','4× Shots','1× Cola','2× IPA','1× Wine'],bars=['BAR W','BAR E','BAR E','BAR W','FOYER'];
const sale=()=>{const p=(4+Math.floor(rnd()*80))+Math.floor(rnd()*4)*.5;return `<span><b>${bars[Math.floor(rnd()*5)]}</b>${items[Math.floor(rnd()*9)]} · €${p.toFixed(2)}</span>`};
let h1='',h2='';for(let i=0;i<40;i++){h1+=scan();h2+=sale()}
const r1=document.getElementById('r1'),r2=document.getElementById('r2');r1.innerHTML=h1+h1;r2.innerHTML=h2+h2;
// graphics cycle
const gs=[0,1,2].map(i=>document.getElementById('g'+i));let gi=0;
function show(i){gs.forEach((g,k)=>{g.classList.remove('on','off');if(k===i)g.classList.add('on')});}
function cycle(){const prev=gs[gi];gi=(gi+1)%3;prev.classList.remove('on');prev.classList.add('off');setTimeout(()=>{gs[gi].classList.remove('off');gs[gi].classList.add('on');prev.classList.remove('off')},350)}
show(0);setTimeout(()=>{cycle();setInterval(cycle,3600)},1200);
// live numbers
let ins=1414,eur=38775,left=58*60+12;
setInterval(()=>{doors.forEach((d,i)=>{if(rnd()<d.r/60*.25*3){d.n++;ins+=1;const c=document.getElementById('dc'+i);c.querySelector('b').textContent=fmt(d.n);c.classList.remove('hit');void c.offsetWidth;c.classList.add('hit')}});
 ins=Math.min(1500,ins);document.getElementById('ins').textContent=fmt(ins);
 eur+=rnd()*466/60*.25*3;document.getElementById('eur').textContent='€'+fmt(eur);},250);
// clock
const st=performance.now();setInterval(()=>{const t=(performance.now()-st)/1000;const tot=21*3600+47*60+4+t;const h=Math.floor(tot/3600),m=Math.floor(tot%3600/60),sx=Math.floor(tot%60);
 document.getElementById('hm').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');document.getElementById('ss').textContent=':'+String(sx).padStart(2,'0');
 const l=left-Math.floor(t);document.getElementById('left').textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0')+' left';document.getElementById('rs').textContent='ON AIR · '+Math.floor(l/60)+':'+String(l%60).padStart(2,'0')+' left';},250);
// ticker crawl
let x1=0,x2=0,last=performance.now();
function crawl(n){const d=(n-last)/1000;last=n;x1-=d*120;x2-=d*85;const w1=r1.scrollWidth/2,w2=r2.scrollWidth/2;if(x1<-w1)x1+=w1;if(x2<-w2)x2+=w2;r1.style.transform=`translateX(${x1}px)`;r2.style.transform=`translateX(${x2}px)`;requestAnimationFrame(crawl)}
requestAnimationFrame(crawl);
// stage strobe flash
(function f(){const e=document.getElementById('flash');e.style.transition='none';e.style.opacity=.22;requestAnimationFrame(()=>{e.style.transition='opacity .45s ease-out';e.style.opacity=0});setTimeout(f,1400+rnd()*1600)})();
document.fonts.ready.then(()=>{window.READY=1});
</script></body></html>
